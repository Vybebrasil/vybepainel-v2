name: Verificação
# Uma vez por envio: nos ramos dos pedidos roda pelo pull_request; na main,
# pelo push. Antes rodava duas vezes em cada envio de pedido aberto.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-validado
          path: dist/
